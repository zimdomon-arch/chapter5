<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Open Source Tools</h1>
        <p>수업에서 사용하는 오픈소스 개발 도구를 소개합니다.</p>
        <button id="messageButton">메시지 보기</button>
        <p id="message"></p>
    </header>

    <main class="tool-list">
        <section class="tool-card">
            <h2>Git</h2>
            <p>소스코드의 변경 이력을 기록하고 관리하는 분산 버전 관리 시스템입니다.</p>
        </section>

        <section class="tool-card">
            <h2>GitHub</h2>
            <p>Git 저장소를 온라인에서 공유하고 협업할 수 있는 플랫폼입니다.</p>
        </section>

        <section class="tool-card">
            <h2>Visual Studio Code</h2>
            <p>다양한 프로그래밍 언어와 확장 기능을 지원하는 코드 편집기입니다.</p>
        </section>

        <!-- 실습: 여기에 새로운 tool-card를 추가해보세요. -->
    </main>

    <footer>
        <p>OSS Clone Practice · 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
